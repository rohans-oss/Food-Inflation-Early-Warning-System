name: agripulse

services:
  db:
    # TimescaleDB HA image ships PostGIS too, so one container covers both.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: agripulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agripulse}
      POSTGRES_DB: agripulse
    ports: ["5432:5432"]
    volumes: [dbdata:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agripulse"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agripulse:${POSTGRES_PASSWORD:-agripulse}@db:5432/agripulse
      REDIS_URL: redis://redis:6379/0
      OSRM_URL: ${OSRM_URL:-}
      SEED_FLAGS: "--demo"   # dev: one demo login per role. The prod overlay sets this to "".
    # $$ = expanded inside the container (so the prod overlay's SEED_FLAGS wins), not by compose
    command: >
      sh -c "alembic upgrade head && python -m agripulse_api.seed $${SEED_FLAGS}
             && uvicorn agripulse_api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes: [models:/app/ml/artifacts]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    # Scheduled ingestion + nightly retrain/forecast (APScheduler).
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agripulse:${POSTGRES_PASSWORD:-agripulse}@db:5432/agripulse
      REDIS_URL: redis://redis:6379/0
    command: python -m ingest.scheduler
    volumes: [models:/app/ml/artifacts, rawdata:/app/data]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: apps/web
      # NEXT_PUBLIC_* is compiled into the browser bundle, so it is a build arg, not runtime env.
      # Empty = the browser uses <same host>:8000, which suits local dev and LAN testing.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports: ["3000:3000"]
    depends_on: [api]

  osrm:
    # Needs a one-time extract: `bash infra/osrm/prepare.sh` (see docs/routing.md).
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/region.osrm
    volumes: [./infra/osrm/data:/data]
    ports: ["5000:5000"]

volumes:
  dbdata:
  models:   # trained model + backtest.json, shared by api (reads) and worker (writes)
  rawdata:  # archived raw Agmarknet payloads: your only copy of daily history
