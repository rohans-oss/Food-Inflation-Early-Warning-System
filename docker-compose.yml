name: agripulse

services:
  db:
    # TimescaleDB HA image ships PostGIS too, so one container covers both.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: agripulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agripulse}
      POSTGRES_DB: agripulse
    ports: ["5432:5432"]
    volumes: [dbdata:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agripulse"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agripulse:${POSTGRES_PASSWORD:-agripulse}@db:5432/agripulse
      REDIS_URL: redis://redis:6379/0
      OSRM_URL: ${OSRM_URL:-}
    command: >
      sh -c "alembic upgrade head && python -m agripulse_api.seed ${SEED_FLAGS:---demo}
             && uvicorn agripulse_api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    # Scheduled ingestion, nightly forecast + spike alerts, weekly retrain (APScheduler).
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agripulse:${POSTGRES_PASSWORD:-agripulse}@db:5432/agripulse
      REDIS_URL: redis://redis:6379/0
    command: python -m ingest.scheduler
    depends_on:
      api: { condition: service_started }

  web:
    # Next.js dashboards for all 9 roles. The API URL is baked in at build time (browser-side calls),
    # so rebuild the image after changing NEXT_PUBLIC_API_URL.
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]

  osrm:
    # Needs a one-time extract: `bash infra/osrm/prepare.sh` (see docs/routing.md).
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/region.osrm
    volumes: [./infra/osrm/data:/data]
    ports: ["5000:5000"]

volumes:
  dbdata:
