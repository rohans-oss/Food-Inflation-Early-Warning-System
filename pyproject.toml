[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agripulse"
version = "1.0.0"
description = "AgriPulse: food-inflation early-warning system with farm-to-mandi vehicle tracking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "redis>=5.0",
  "psycopg[binary]>=3.1",
  "pandas>=2.1",
  "numpy>=1.26",
  "lightgbm>=4.3",
  "scikit-learn>=1.3",  # required by lightgbm.sklearn (LGBMRegressor / LGBMClassifier)
  "mlflow-skinny>=3.0",
  "pyarrow>=15",  # V2 feature tables (parquet)  # V2 experiment tracking (client only; `pip install mlflow` adds the UI server)
  "ortools>=9.10",  # V3-0 optimizer (CP-SAT)
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
# Pre-V3 B-2: tests/test_driver_app.py runs the driver app in headless Chromium (skips without it)
browser = ["playwright>=1.40"]
mlflow-ui = ["mlflow>=3.0"]
# V2-2 TFT (CPU is enough; see docs/tft-results.md for timings). tests/test_tft.py skips without it.
tft = ["pytorch-forecasting>=1.4", "lightning>=2.4", "torch>=2.4"]
# V2-3 mandi graph: GNN (torch), networkx export, optional Neo4j mirror. Graph FEATURES need none of these.
graph = ["torch>=2.4", "networkx>=3", "neo4j>=5"]
# V2-4 Sentinel-2 fetch (satellite.run / extract). Loading, features and validation need none of these.
satellite = ["rasterio>=1.3", "pyproj>=3.5"]

# One installable project, four packages, laid out as in the project doc (§12).
[tool.setuptools.packages.find]
where = ["services/api", "services/ingest", "services/tracking", "ml"]

[tool.setuptools.package-data]
agripulse_api = ["i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
