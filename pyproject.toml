[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agripulse"
version = "1.0.0"
description = "AgriPulse: food-inflation early-warning system with farm-to-mandi vehicle tracking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "redis>=5.0",
  "psycopg[binary]>=3.1",
  "pandas>=2.1",
  "numpy>=1.26",
  "lightgbm>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
mlflow = ["mlflow>=2.12"]

# One installable project, four packages, laid out as in the project doc (§12).
[tool.setuptools.packages.find]
where = ["services/api", "services/ingest", "services/tracking", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
