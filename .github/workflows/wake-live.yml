# The free LIVE API sleeps when idle, so its in-process scheduler can miss Agmarknet's daily data. Waking it after the
# midday and evening publication times lets its start-up catch-up (ingest/live.py) pull whatever is overdue.
name: wake live demo
on:
  schedule:
    - cron: "45 7 * * *"   # 13:15 IST
    - cron: "30 14 * * *"  # 20:00 IST
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: ping API health (cold start can take a minute)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -m 90 https://agripulse-api-0ir4.onrender.com/health && exit 0
            sleep 20
          done
          exit 1
