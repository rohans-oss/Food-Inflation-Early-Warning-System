# Best-mandi recommender cost parameters (V1, rule-based).
#
#   net value = p50 price x quantity
#             - transport cost   (road km x rate_per_km_ton x tons)
#             - spoilage loss    (gross x spoilage %)
#   spoilage % = base_pct_per_hour x trip hours x q10 ^ ((temp - reference_temp_c) / 10) x crop sensitivity
#
# These are STARTING ASSUMPTIONS, not measured values. Replace them with numbers from
# your field test / transporter quotes and note the source next to each one.
# Override the file location with RECOMMENDER_CONFIG=/path/to/file.toml

[transport]
rate_per_km_ton = 12.0          # INR per road-km per tonne. Assumption: typical small-truck freight quote.

[spoilage]
base_pct_per_hour = 0.4         # % of value lost per trip hour at the reference temperature. Assumption.
reference_temp_c = 30.0
q10 = 2.0                       # loss rate multiplies by q10 for every +10 C (standard respiration rule of thumb)
default_temp_c = 30.0           # used when no weather row exists for the mandi today

[spoilage.crop_sensitivity]     # multiplier on the base rate
Tomato = 1.0
# Onion = 0.3                   # enable when onion is in scope (V2+)
# Tur = 0.05

[search]
radius_km = 300                 # straight-line pre-filter before routing
max_candidates = 12             # nearest N mandis get routed and ranked

# ---------------------------------------------------------------- V3-0: optimizer (agripulse_api.decisions)
[recommender]
# Which recommender users get: "rule" (V1, one lot at a time) or "optimizer" (OR-Tools CP-SAT, all lots together).
# Pre-registered switch rule (docs/optimizer-results.md): "optimizer" becomes the default only if, on the V3-0 study,
# its realised net value is >= the rule's on average AND it has fewer constraint violations.
# V3-0 result (SYNTHETIC): met. Net value a tie (+0.07%), violations 140 -> 0. tests/test_decisions.py pins this.
default = "optimizer"

[transport.vehicle]
# Trucks are hired per trip, so V3 costs a vehicle per km driven (not per tonne-km as V1 did).
# Cost per km = base_rate_per_km + rate_per_km_per_capacity_ton x capacity. ASSUMPTIONS: replace with fleet quotes.
base_rate_per_km = 18.0         # INR/km, any vehicle (driver, fuel base)
rate_per_km_per_capacity_ton = 4.0   # INR/km per tonne of capacity (a 5 t truck = 38 INR/km)
count_return_leg = true         # the truck drives back to its base empty (V3-1 return loads reduce this)
sizes_tons = [2.5, 5.0, 9.0, 10.0, 16.0]   # truck sizes a farmer can hire; single-lot advice assumes the smallest that fits

[constraints]
max_spoilage_pct = 8.0          # hard cap on expected transit loss per lot (%). ASSUMPTION.
mandi_extra_share = 0.25        # extra tonnes a mandi can take in one day, as a share of its typical daily arrivals. ASSUMPTION.

[optimizer]
objective = "p50"               # "p50" = expected value; "p10" = risk-averse (plan on the low price)
time_limit_s = 10.0
max_mandis_per_lot = 12         # nearest N mandis considered per lot (same as [search] max_candidates)
workers = 8
