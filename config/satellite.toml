# V2-4 Sentinel-2 crop signal. Override the path with SATELLITE_CONFIG=/path/file.toml
# Endpoints and field names below were checked against real responses on 2026-09-29 (docs/data-sources.md).

[stac]
url = "https://earth-search.aws.element84.com/v1"   # Element 84 Earth Search, no key
collection = "sentinel-2-l2a"
max_cloud_pct = 60          # scene-level eo:cloud_cover filter; pixels are masked again with SCL
page_limit = 100

[extract]
resolution_m = 80           # read a decimated overview (COG) instead of 10 m: ~64x less data, fine for district-level signal
# Scene classification (SCL) classes kept as clear land: 4 = vegetation, 5 = not vegetated.
# Dropped: 0 no data, 1 saturated, 2 dark/shadow, 3 cloud shadow, 6 water, 7 unclassified, 8-10 cloud / cirrus, 11 snow.
scl_valid = [4, 5]
min_valid_pixels = 50       # below this, the scene/district observation is dropped (too cloudy)

[cropland]
# ESA WorldCover 2021 v200, 10 m, class 40 = cropland. 3x3 degree COG tiles (names verified by bucket listing).
url_template = "https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif"
class = 40

# Publication lag (acquisition d usable from d + 2) lives with the other lags: config/features.toml sentinel2.

[composite]
days = 10                   # 10-day median composites per district

[pilot]
start = "2018-01-01"
# District areas are APPROXIMATED as circles around the district HQ until real district polygons are added.
# Coordinates are approximate town centroids (same caveat as mandi coordinates, backlog #3).
districts = [
  { name = "Kolar",          lat = 13.137, lon = 78.129, radius_km = 30 },
  { name = "Chikkaballapur", lat = 13.435, lon = 77.727, radius_km = 30 },
]
