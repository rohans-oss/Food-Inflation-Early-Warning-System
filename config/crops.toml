# Vegetables a farmer can register (lots, transport booking, tracking, delivery receipt, payment work for all of them).
# Price FORECASTS exist only where forecast = true: tomato is the only crop with a model (V1-V3 scope). Other crops
# get mandi options ranked by transport cost and spoilage, with no price, and the UI says so.
# Spoilage sensitivity per crop lives in config/recommender.toml [spoilage.crop_sensitivity] (assumptions).
# Override the file location with CROPS_CONFIG=/path/file.toml

[[crop]]
name = "Tomato"
kn = "ಟೊಮ್ಯಾಟೊ"
hi = "टमाटर"
forecast = true

